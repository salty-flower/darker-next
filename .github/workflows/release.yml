name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  release:
    name: Semantic release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true
      - name: Restore dependencies
        run: dotnet restore
      - name: Publish Native AOT build
        run: >-
          dotnet publish src/DarkerConsole/DarkerConsole.csproj
          -c Release
          -r win-x64
          -p:PublishAot=true
          --self-contained true
          -o build/publish
      - name: Archive release artifacts
        shell: pwsh
        run: |
          Compress-Archive -Path "build/publish/*" -DestinationPath "build/DarkerConsole-win-x64.zip" -Force
      - name: Semantic release
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 23.0.0
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
            conventional-changelog-conventionalcommits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
